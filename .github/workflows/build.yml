name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'
    
    - name: Upgrade pip
      run: python -m pip install --upgrade pip
    
    - name: Install PyInstaller
      run: pip install pyinstaller
    
    - name: Install llama-cpp-python (Pre-compiled Wheel)
      run: |
        echo "Installing llama-cpp-python from pre-compiled wheels..."
        pip install llama-cpp-python --prefer-binary --extra-index-url=https://jllllll.github.io/llama-cpp-python-cuBLAS-wheels/AVX2/x64
      continue-on-error: true
    
    - name: Verify installation
      run: |
        python -c "import sys; print('Python version:', sys.version)"
        python -c "import llama_cpp; print('SUCCESS: llama_cpp is installed!')" || echo "WARNING: llama_cpp not found, will use regex fallback"
    
    - name: Build EXE with PyInstaller
      run: |
        echo "Running PyInstaller..."
        pyinstaller docparser.spec --clean --noconfirm
    
    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DocParser-Windows-EXE
        path: dist/DocParser.exe
        retention-days: 30
