name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Install llama-cpp-python
      run: |
        pip install llama-cpp-python --prefer-binary --extra-index-url=https://jllllll.github.io/llama-cpp-python-cuBLAS-wheels/AVX2/x64
      continue-on-error: true
    
    - name: Build EXE
      run: |
        pyinstaller docparser.spec --clean
    
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: DocParser-EXE
        path: dist/DocParser.exe
        retention-days: 30
