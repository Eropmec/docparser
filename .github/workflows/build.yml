name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'
    
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Try to install llama-cpp-python
      run: |
        echo "Пытаемся установить llama-cpp-python..."
        pip install llama-cpp-python --no-cache-dir || echo "LLM не установлен, продолжаем сборку без него (будет работать Regex-парсер)"
      continue-on-error: true
    
    - name: Build EXE
      run: |
        echo "Запуск PyInstaller..."
        pyinstaller docparser.spec --clean --noconfirm
    
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: DocParser-EXE
        path: dist/DocParser.exe
        retention-days: 30
